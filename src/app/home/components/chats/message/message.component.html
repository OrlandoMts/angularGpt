@if(isGpt) {
<div class="col-start-1 col-end-9 p-3 rounded-lg">
  <div class="flex flex-row items-start">
    <div
      class="flex items-center justify-center h-10 w-10 rounded-full bg-green-600 flex-shrink-0"
    >
      <i class="fa-solid fa-robot"></i>
    </div>
    <div
      class="relative ml-3 text-sm bg-black bg-opacity-25 pt-3 pb-2 px-4 shadow rounded-xl"
    >
      <markdown>
        {{ text }}
      </markdown>

      @if(audioUrl && audioUrl.length > 0) {
      <audio controls [src]="audioUrl" autoplay></audio>
      }
    </div>
  </div>
</div>
} @else {
<div class="col-start-6 col-end-12 p-3 rounded-lg">
  <div class="flex items-center justify-start flex-row-reverse">
    <div
      class="flex items-center justify-center h-10 w-10 rounded-full bg-indigo-500 flex-shrink-0"
    >
      <i class="fa-solid fa-user"></i>
    </div>
    <div
      class="relative mr-3 text-sm bg-black bg-opacity-25 pt-3 pb-2 px-4 shadow rounded-xl"
    >
      {{ text }}
    </div>
  </div>
</div>

}
