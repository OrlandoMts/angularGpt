<div class="chat-container">
  <div class="chat-messages">
    <div class="grid gap-y-2">
      <!-- Chat messages -->
      @for (msg of messages(); track $index) {
      <!-- <app-message [text]="msg.text" [isCurrentUser]="msg.isGpt" /> -->
      <app-message-orthography
        [isGpt]="msg.isGpt"
        [useScore]="msg.info?.userScore || 0"
        [text]="msg.info?.message || msg.text"
        [errors]="msg.info?.errors || []"
      />
      } @if(isLoading()) {
      <app-typing-loader />
      }
    </div>
  </div>
  <!-- MessageBox -->
  <app-txt-message-box
    [options]="options"
    (onMessage)="handleMessage($event)"
  />
</div>
