<div class="chat-container">
  <div class="chat-messages">
    <div class="grid gap-y-2">
      <!-- Chat messages -->
      @for (msg of messages(); track msg?.text) {
      <app-message [text]="msg.text" [isGpt]="msg.isGpt" />
      } @if(isLoading()) {
      <app-typing-loader />
      }
    </div>
  </div>
  <!-- MessageBox -->
  <app-txt-message-box (onMessage)="handleMessage($event)" />
</div>
